<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>El gallo</h1>
 
  <img src="src/gallo.JPG" alt="Retrato de un gallo">
 
  <!-- loop: al terminar vuelve a empezar automáticamente -->
  <!-- autoplay: algunos navegadores lo bloquean hasta que el usuario interactúa con la página -->
  <audio controls autoplay loop>
    <source src="src/gallo.mp3" type="audio/mp3">
    <source src="src/gallo.ogg" type="audio/ogg">
    Tu navegador no soporta el elemento de audio.
  </audio>
</body>
</html>
